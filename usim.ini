# USIM Configuration File
# C# Port Configuration

[General]
# System directory containing microcode and system files
sys-directory = ./sys

# File system root directory
fs-root-directory = ./fs

[Display]
# Window title
window-title = CADR Lisp Machine (C#)

# Display refresh rate in Hz
display-refresh-rate = 60

# Enable color TV support
colortv = false

[Execution]
# Auto-boot on startup
auto-boot = false

# Auto power off when system halts
auto-power-off = false

# Run in headless mode (no display)
headless = false

[Debug]
# Verbose state dumping
verbose-dump = false

# Enable microcode tracing
trace-microcode = false

# Enable memory access tracing
trace-memory = false

[Paths]
# State file for save/restore
state-file = usim.state

# Microcode file
microcode-file = ./sys/microcode.mcr

# PROM file
prom-file = ./sys/prom.prom

# Disk image
disk-image = ./sys/disk.img

# Tape image
tape-image = ./sys/tape.img

[Network]
# Enable Chaos network
chaos-enabled = false

# Local Chaos address (subnet.host)
chaos-address = 0.404

# Chaos interface name
chaos-interface = chaos0

[Devices]
# Enable disk controller
disk-enabled = true

# Enable tape controller
tape-enabled = false

# Enable mouse
mouse-enabled = true

# Enable keyboard
keyboard-enabled = true
