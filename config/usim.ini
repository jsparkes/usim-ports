# USIM - CADR Lisp Machine Emulator Configuration
# ================================================

[General]
# System configuration
system_version = 300
verbose = false
headless = false
auto_boot = false
auto_poweroff = false

[Paths]
# System directories (use forward slashes or double backslashes)
sys_directory = ./sys
fs_root = ./fs
state_file = usim.state
prom_file = ./sys/prom.bin
microcode_file = ./sys/microcode.bin
dispatch_rom = ./sys/dispatch.bin

[Memory]
# Memory configuration
main_memory_size = 0x2000000
# Main memory size in bytes (32MB default)
use_physical_memory = false
enable_paging = true
page_size = 0x400
# Page size in words (1024 words = 4KB)

[Microcode]
# Microcode engine settings
enable_prom = true
load_microcode = true
microcode_trace = true
instruction_trace = true
enable_stats = true

[Display]
# Video configuration
width = 1024
height = 808
scale = 1.0
# Scale factor for window size
use_linear_filtering = true
allow_resize = false
color_tv = true
frame_rate = 60

[SDL2]
# SDL2 backend settings
enable_sdl2 = true
video_driver = auto
# Options: auto, windows, x11, wayland
renderer = auto
# Options: auto, software, opengl, opengles2, direct3d, metal
vsync = true
fullscreen = false

[Keyboard]
# Keyboard configuration
keyboard_type = cadr
# Options: cadr, knight
repeat_delay = 500
# Initial delay in milliseconds
repeat_rate = 30
# Repeat rate in Hz
meta_is_alt = true
super_is_windows = true

[Mouse]
# Mouse configuration
enable_mouse = true
mouse_sensitivity = 1.0
invert_y = false
button_swap = false
# Swap left and right buttons

[Disk]
# Disk controller configuration
disk_image = ./disk.img
disk_size = 0x40000000
# Disk size in bytes (1GB default)
read_only = false
cache_size = 4096
# Cache size in blocks
enable_dma = true

[Network]
# Chaos network (not yet implemented)
enable_chaos = false
chaos_address = 401
chaos_subnet = 0

[Audio]
# Audio configuration
enable_audio = true
sample_rate = 44100
buffer_size = 2048
beep_enabled = true

[Performance]
# Performance tuning
max_cycles_per_frame = 1000000
enable_sleep = true
sleep_granularity = 1
# Sleep time in milliseconds
instruction_limit = 0
# 0 = unlimited

[Debug]
# Debug settings
enable_trace_log = false
trace_categories = Display,Keyboard,Mouse,Microcode,All
# Categories: All, Display, Keyboard, Mouse, Memory, Disk, Network, Microcode
trace_level = Verbose
# Levels: Error, Warning, Info, Debug, Verbose
log_file = usim.log
dump_state_on_exit = false
verbose_dump = false

[Tracing]
# Execution tracing
trace_execution = true
trace_memory = false
trace_io = false
trace_interrupts = false
trace_microcode = true
max_trace_lines = 10000

[Breakpoints]
# Debugging breakpoints (not yet implemented)
enable_breakpoints = false
break_on_pc = 0x0000
break_on_error = true
break_on_halt = true

[Compatibility]
# Compatibility settings
strict_timing = false
# Enable cycle-accurate timing
emulate_hardware_bugs = false
# Emulate known hardware quirks

[Advanced]
# Advanced settings
gc_frequency = 1000
# Garbage collection frequency (cycles)
enable_optimization = true
jit_compilation = false
# JIT compilation (future feature)
parallel_execution = false
# Parallel execution (future feature)
